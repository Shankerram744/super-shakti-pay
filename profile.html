<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | Super Shakti Pay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071b3b;
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}


.header{
color:white;
text-align:center;
font-size:28px;
font-weight:bold;
margin:20px;
}


.profile-card{

background:white;
border-radius:20px;
padding:25px;
text-align:center;
}


.avatar{

width:90px;
height:90px;
border-radius:50%;
background:gold;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:45px;

}


.name{

font-size:24px;
font-weight:bold;
color:#071b3b;
margin-top:15px;

}


.info{

background:#f5f5f5;
padding:15px;
border-radius:12px;
margin-top:15px;
text-align:left;

}


.info p{

margin:10px 0;

font-size:16px;

}


.back{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:30px;
background:#071b3b;
color:white;
font-size:18px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="container">


<div class="header">

👤 My Profile

</div>


<div class="profile-card">


<div class="avatar">

👤

</div>


<div class="name" id="userName">

User Name

</div>


<div class="info">
<p>
<b>📱 Mobile:</b>
<span id="userMobile">
Loading...
</span>
</p>


<p>
<b>🎁 Referral Code:</b>
<span id="refCode">
Loading...
</span>
</p>


<p>
<b>💰 Wallet Balance:</b>
₹<span id="wallet">
0
</span>
</p>


<p>
<b>✅ Status:</b>
<span id="status">
Active
</span>
</p>


</div>


</div>


<button class="back"
onclick="location.href='dashboard.html'">

🏠 Back To Dashboard

</button>


</div>


<script type="module" src="profile.js"></script>


</body>

</html>
