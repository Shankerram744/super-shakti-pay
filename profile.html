<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.header{
background:#071b3b;
color:white;
padding:20px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.photo{
width:100px;
height:100px;
background:gold;
border-radius:50%;
margin:auto;
font-size:50px;
display:flex;
justify-content:center;
align-items:center;
}

.info{
margin-top:20px;
font-size:18px;
line-height:35px;
}

button{
width:90%;
padding:15px;
margin-top:20px;
background:#071b3b;
color:white;
border:none;
border-radius:30px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="header">
My Profile
</div>

<div class="card">

<div class="photo">👤</div>

<div class="info">

<b>Name :</b>
<span id="name"></span>

<br>

<b>Mobile :</b>
<span id="mobile"></span>

<br>

<b>Wallet Balance :</b>
₹ <span id="balance"></span>

</div>

<button onclick="logout()">
Logout
</button>

</div>

<script>

document.getElementById("name").innerHTML =
localStorage.getItem("name") || "User";

document.getElementById("mobile").innerHTML =
localStorage.getItem("mobile") || "";

document.getElementById("balance").innerHTML =
localStorage.getItem("balance") || 0;

function logout(){

if(confirm("Are you sure you want to Logout?")){

window.location.href="login.html";

}

}

</script>

</body>
</html>
