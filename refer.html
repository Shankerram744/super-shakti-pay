<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refer & Earn</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.header{
background:#071b3b;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.box{
background:white;
width:90%;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.code{
background:#FFD700;
padding:15px;
border-radius:10px;
font-size:24px;
font-weight:bold;
margin:20px 0;
}

button{
width:100%;
padding:15px;
margin-top:10px;
background:#071b3b;
color:white;
border:none;
border-radius:30px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="header">
🎁 Refer & Earn
</div>

<div class="box">

<h2>Your Referral Code</h2>

<div class="code" id="refcode"></div>

<p>Invite your friends and earn rewards.</p>

<button onclick="copyCode()">Copy Referral Code</button>

<button onclick="window.location.href='dashboard.html'">
⬅ Back to Dashboard
</button>

</div>

<script>

let mobile = localStorage.getItem("mobile") || "0000000000";
let code = "SSP" + mobile.slice(-6);

document.getElementById("refcode").innerHTML = code;

function copyCode(){

navigator.clipboard.writeText(code);

alert("Referral Code Copied!");

}

</script>

</body>
</html>
