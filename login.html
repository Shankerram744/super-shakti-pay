<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Super Shakti Pay</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071b3b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:100%;
max-width:420px;
padding:20px;
}

.card{
background:#fff;
border-radius:20px;
padding:30px;
box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#071b3b;
margin-bottom:10px;
}

.sub{
text-align:center;
color:#666;
margin-bottom:25px;
}

.input{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
outline:none;
}

.input:focus{
border-color:#071b3b;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:30px;
background:#071b3b;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.btn:hover{
background:#0d47a1;
}

.link{
text-align:center;
margin-top:20px;
}

.link a{
color:#071b3b;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
💳 Super Shakti Pay
</div>

<div class="sub">
Login to your account
</div>

<input
type="text"
id="mobile"
class="input"
placeholder="Mobile Number"
maxlength="10">

<input
type="password"
id="password"
class="input"
placeholder="Password">

<button
class="btn"
onclick="login()">
Login
</button>

<div class="link">
Don't have an account?
<a href="register.html">
Register
</a>
</div>

</div>

</div>
<script src="login.js"></script>

</body>
</html>
