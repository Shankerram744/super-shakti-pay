<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.header{
background:#071b3b;
color:white;
text-align:center;
padding:20px;
font-size:24px;
font-weight:bold;
}

.card{
background:white;
margin:15px;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.2);
font-size:18px;
}

button{
margin:20px;
padding:12px 20px;
background:gold;
border:none;
border-radius:25px;
font-size:18px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="header">
Transaction History
</div>

<div class="card" id="history">
No Transactions Yet
</div>

<center>
<button onclick="window.location.href='dashboard.html'">
⬅ Back
</button>
</center>

<script>
document.getElementById("history").innerHTML =
localStorage.getItem("history") || "No Transactions Yet";
</script>

</body>
</html>
