<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Money | Super Shakti Pay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071b3b;
}

.container{
max-width:420px;
margin:25px auto;
padding:15px;
}

.card{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#071b3b;
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:30px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.add{
background:#28a745;
color:#fff;
}

.back{
background:#071b3b;
color:#fff;
}

.note{
margin-top:20px;
padding:15px;
background:#f5f5f5;
border-radius:10px;
font-size:14px;
color:#555;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>➕ Add Money</h2>

<label>Enter Amount</label>

<input
type="number"
id="amount"
placeholder="Enter Amount">

<button class="add" onclick="addMoney()">
Continue
</button>

<div class="note">
This is the Add Money screen UI.
</div>
<button class="back"
onclick="location.href='wallet.html'">
⬅ Back To Wallet
</button>

</div>

</div>

<script type="module" src="add-money.js"></script>

</body>
</html>
