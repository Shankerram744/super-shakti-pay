<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
padding-bottom:80px;
}

.header{
background:#071b3b;
color:white;
padding:20px;
text-align:center;
}

.logo{
font-size:30px;
font-weight:bold;
}

.founder{
font-size:15px;
color:gold;
margin-top:8px;
}

.userinfo{
margin-top:15px;
font-size:17px;
line-height:28px;
}

.balance{
background:gold;
margin:20px;
padding:20px;
border-radius:15px;
text-align:center;
font-size:22px;
font-weight:bold;
box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}

.box{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
font-size:20px;
font-weight:bold;
box-shadow:0 3px 8px rgba(0,0,0,.2);
cursor:pointer;
transition:.3s;
}

.box:hover{
transform:scale(1.03);
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#071b3b;
display:flex;
justify-content:space-around;
padding:12px 0;
color:white;
}

.bottom-nav div{
text-align:center;
font-size:15px;
font-weight:bold;
cursor:pointer;
color:white;
}
</style>
</head>

<body>

<div class="header">

<div class="logo">
SUPER SHAKTI PAY
</div>

<div class="founder">
👑 Founder & Developer : <b>Shanker Riwadiya</b>
</div>

<div class="userinfo">
Welcome,
<b><span id="username"></span></b>
<br>

<span id="mobile"></span>
<br>

<span id="today"></span>

</div>

</div>

<div class="balance">
Wallet Balance
<br><br>
₹ <span id="balance">0</span>
</div>

<div class="grid">

<div class="box" onclick="window.location.href='addmoney.html'">
➕<br>Add Money
</div>

<div class="box" onclick="window.location.href='withdraw.html'">
💸<br>Withdraw
</div>

<div class="box" onclick="window.location.href='history.html'">
📜<br>History
</div>

<div class="box" onclick="window.location.href='profile.html'">
👤<br>Profile
</div>

<div class="box" onclick="window.location.href='refer.html'">
🎁<br>Refer & Earn
</div>

<div class="box" onclick="window.location.href='scanqr.html'">
📷<br>Scan QR
</div>

</div>

<div class="bottom-nav">

<div onclick="window.location.href='dashboard.html'">
🏠<br>Home
</div>

<div onclick="window.location.href='history.html'">
📜<br>History
</div>

<div onclick="window.location.href='refer.html'">
🎁<br>Refer
</div>

<div onclick="window.location.href='profile.html'">
👤<br>Profile
</div>

</div>

<script>

document.getElementById("balance").innerHTML =
localStorage.getItem("balance") || "0";

document.getElementById("username").innerHTML =
localStorage.getItem("name") || "User";

document.getElementById("mobile").innerHTML =
localStorage.getItem("mobile") || "";

document.getElementById("today").innerHTML =
new Date().toDateString();

</script>

</body>
</html>
