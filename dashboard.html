<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Super Shakti Pay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071b3b;
padding-bottom:90px;
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}


.header{
display:flex;
justify-content:space-between;
align-items:center;
color:white;
margin:20px 0;
}


.logo h2{
font-size:26px;
color:gold;
}


.logo p{
font-size:14px;
color:white;
}


.notify{
width:45px;
height:45px;
border-radius:50%;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}


.balance-card{

background:linear-gradient(135deg,#0d47a1,#42a5f5);

padding:25px;

border-radius:20px;

color:white;

margin-bottom:15px;

box-shadow:0 5px 15px rgba(0,0,0,.3);

}


.balance-card h1{

font-size:40px;

margin:10px 0;

}


.founder{

background:white;

padding:12px;

border-radius:15px;

text-align:center;

margin-bottom:20px;

font-weight:bold;

color:#071b3b;

box-shadow:0 3px 10px rgba(0,0,0,.2);

}


.founder span{

color:#d4af37;

font-size:18px;

}


.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}


.card{

background:white;

padding:20px;

border-radius:15px;

text-align:center;

cursor:pointer;

box-shadow:0 3px 10px rgba(0,0,0,.2);

font-weight:bold;

color:#071b3b;

}


.card span{

display:block;

font-size:35px;

margin-bottom:10px;

}


.card:hover{

transform:scale(1.03);

transition:.3s;

}
.logout{

width:100%;

padding:15px;

margin-top:20px;

background:#e53935;

color:white;

border:none;

border-radius:30px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


.bottom-nav{

position:fixed;

bottom:0;

left:0;

width:100%;

height:65px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -3px 10px rgba(0,0,0,.2);

}


.bottom-nav a{

text-decoration:none;

color:#071b3b;

text-align:center;

font-size:13px;

font-weight:bold;

}


</style>

</head>


<body>


<div class="container">


<div class="header">


<div class="logo">

<h2>
Super Shakti Pay
</h2>

<p>
Welcome Back
</p>

</div>


<div class="notify">
🔔
</div>


</div>



<div class="balance-card">

<p>
Available Balance
</p>


<h1>
₹ <span id="wallet">0</span>
</h1>


<p>
Updated Just Now
</p>


</div>



<div class="founder">

Founder

<br>

<span>
Shanker Riwadiya
</span>

</div>




<div class="grid">


<div class="card" onclick="location.href='add-money.html'">

<span>
➕
</span>

Add Money

</div>



<div class="card" onclick="location.href='withdraw.html'">

<span>
💸
</span>

Withdraw

</div>



<div class="card" onclick="location.href='wallet.html'">

<span>
💰
</span>

Wallet

</div>



<div class="card" onclick="location.href='history.html'">

<span>
📜
</span>

History

</div>
<div class="card" onclick="location.href='transaction-report.html'">

<span>
📊
</span>

Transaction Report

</div>



<div class="card" onclick="location.href='refer.html'">

<span>
🎁
</span>

Refer & Earn

</div>



<div class="card" onclick="location.href='profile.html'">

<span>
👤
</span>

Profile

</div>



<div class="card" onclick="location.href='settings.html'">

<span>
⚙️
</span>

Settings

</div>



<div class="card" onclick="location.href='admin.html'">

<span>
🛡️
</span>

Admin

</div>



</div>



<button class="logout" onclick="logout()">

🚪 Logout

</button>



</div>



<div class="bottom-nav">


<a href="dashboard.html">

🏠
<br>
Home

</a>


<a href="wallet.html">

💰
<br>
Wallet

</a>


<a href="history.html">

📜
<br>
History

</a>


<a href="profile.html">

👤
<br>
Profile

</a>


</div>



<script type="module" src="dashboard.js"></script>


</body>

</html>
